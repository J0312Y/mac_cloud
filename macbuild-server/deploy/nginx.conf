# /etc/nginx/sites-available/macbuild
# symlink: ln -s /etc/nginx/sites-available/macbuild /etc/nginx/sites-enabled/

upstream macbuild_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name api.yourdomain.com;           # ← change this
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;           # ← change this

    # SSL (certbot will fill these in)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options          DENY;
    add_header X-Content-Type-Options   nosniff;
    add_header X-XSS-Protection         "1; mode=block";
    add_header Referrer-Policy          strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # API routes
    location /api {
        proxy_pass          http://macbuild_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;

        # Large IPA downloads
        client_max_body_size 0;
        proxy_buffering off;
    }

    # Socket.io WebSocket — CRITICAL: must not buffer
    location /socket.io/ {
        proxy_pass          http://macbuild_api;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  "Upgrade";
        proxy_set_header    Host        $host;
        proxy_set_header    X-Real-IP   $remote_addr;
        proxy_cache_bypass  $http_upgrade;
        proxy_read_timeout  3600s;      # 1 hour — keep WS alive during long builds
        proxy_send_timeout  3600s;
    }
}
